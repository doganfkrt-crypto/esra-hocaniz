<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Esra Hoca'nız</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Esra Hoca'nız">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2f52cf">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Düzen: solda defter sırtı gibi dar menü (dar ekranda alt sekme çubuğu), sağda tek sütun çalışma alanı */
:root{
  --bg:#f5f6fa; --surface:#ffffff; --surface2:#eef1f7; --ink:#1c2236; --muted:#5f6883; --line:#dde2ec;
  --accent:#2f52cf; --accent-soft:#e5ebfc; --hl:#f3b62f; --hl-soft:#fdf1d2;
  --ok:#17905f; --ok-soft:#dcf3e8; --warn:#c77a06; --warn-soft:#fcedd3; --bad:#cf3f3f; --bad-soft:#fbe1e1; --wa:#1f9d57;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.05);
  --f-display:"Outfit","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter",-apple-system,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10131b; --surface:#181c27; --surface2:#212636; --ink:#e7eaf3; --muted:#9aa2bb; --line:#2b3145;
  --accent:#819bff; --accent-soft:#252f55; --hl:#f5c04b; --hl-soft:#3b3220;
  --ok:#3fcf92; --ok-soft:#173a2c; --warn:#f0aa3c; --warn-soft:#3d2e14; --bad:#f27272; --bad-soft:#432023; --wa:#3fcf7d;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131b; --surface:#181c27; --surface2:#212636; --ink:#e7eaf3; --muted:#9aa2bb; --line:#2b3145;
  --accent:#819bff; --accent-soft:#252f55; --hl:#f5c04b; --hl-soft:#3b3220;
  --ok:#3fcf92; --ok-soft:#173a2c; --warn:#f0aa3c; --warn-soft:#3d2e14; --bad:#f27272; --bad-soft:#432023; --wa:#3fcf7d;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:700} h2{font-size:19px;font-weight:600} h3{font-size:16px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.55}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:16px;height:16px}

.app{display:flex;min-height:100%}
nav.side{width:214px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;overflow-y:auto;padding-left:max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px}
.brand .mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;flex:none}
.brand b{font-family:var(--f-display);font-size:17px;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:12px}
.nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:0;background:none;text-align:left;color:var(--muted);font-weight:500;width:100%}
.nv:hover{background:var(--surface2);color:var(--ink)}
.nv.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:8px 12px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;display:inline-block}
.dot.loc{background:var(--warn)}
main{flex:1;min-width:0;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
body.stu .wrap{max-width:760px}
body.stu nav{display:none!important}
nav.tabbar{display:none}
@media (max-width:899px){
  nav.side{display:none}
  nav.tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));justify-content:space-around}
  nav.tabbar .nv{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 2px;align-items:center;width:auto;flex:1;min-width:0}
  main{padding-bottom:96px}
  body.stu main{padding-bottom:40px}
}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--muted)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card>h2,.card>h3{margin-bottom:12px}
.ctitle{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ctitle h2,.ctitle h3{margin:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;text-align:left;box-shadow:var(--shadow)}
button.kpi:hover{border-color:var(--accent)}
.kpi .l{font-size:13px;color:var(--muted);font-weight:500}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:500}
.kpi .s{font-size:12.5px;color:var(--muted)}
.meter{height:6px;border-radius:4px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--accent)}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:500;min-height:40px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08);color:#fff}
:root[data-theme="dark"] .btn.pri,:root[data-theme="dark"] .btn.pri:hover{color:#0d1330}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri,:root:not([data-theme="light"]) .btn.pri:hover{color:#0d1330}}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.wa:hover{filter:brightness(1.08);color:#fff}
.btn.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)} .btn.danger:hover{border-color:var(--bad)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:14px}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:38px;height:38px;display:inline-grid;place-items:center;flex:none;color:var(--ink)}
.ib:hover{border-color:var(--accent);color:var(--accent)}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;color:#fff;flex:none;font-size:15px}
.muted{color:var(--muted)} .small{font-size:13px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}

.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface)}
.alert .sev{width:4px;align-self:stretch;border-radius:3px;background:var(--warn);flex:none}
.alert.bad .sev{background:var(--bad)} .alert.info .sev{background:var(--accent)} .alert.ok .sev{background:var(--ok)}
.alert .t{font-weight:600} .alert .r{font-size:13px;color:var(--muted)}

.calls{display:flex;flex-direction:column}
.crow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line);flex-wrap:wrap}
.crow:first-child{border-top:0}
.crow .nm{font-weight:600}
.crow .meta{font-size:13px;color:var(--muted)}

.scard{display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left}
.scard:hover{border-color:var(--accent)}
.scard .top{display:flex;gap:12px;align-items:center}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:13px}
.kv span{color:var(--muted);display:block;font-size:12px}
.kv b{font-weight:600}

.weeknav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.weeknav .wl{font-family:var(--f-display);font-weight:600;font-size:17px;min-width:170px;text-align:center}
.pgrid-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px 6px}
.pgrid{display:grid;grid-template-columns:repeat(7,minmax(122px,1fr));gap:8px;min-width:890px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:0}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day .dh{padding:10px 10px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.day .dh .r1{display:flex;justify-content:space-between;align-items:center;gap:6px}
.day .dh b{font-family:var(--f-display);font-size:15px}
.day .dh small{color:var(--muted)}
.day .dq{font-size:11.5px;color:var(--muted)}
.callmark{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted);border:0;flex:none}
.callmark.ok{background:var(--ok-soft);color:var(--ok)} .callmark.no{background:var(--bad-soft);color:var(--bad)} .callmark.warn{background:var(--warn-soft);color:var(--warn)} .callmark.acc{background:var(--accent-soft);color:var(--accent)}
.tasks{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}
.task{display:flex;gap:8px;align-items:flex-start;padding:7px 7px 7px 8px;border-radius:9px;background:var(--surface2);border-left:3px solid var(--sc,var(--accent))}
.task .body{flex:1;min-width:0;cursor:pointer}
.task .sb{font-weight:600;font-size:13.5px;line-height:1.25}
.task .tp{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.tnote{font-size:12px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--hl-soft);color:var(--ink);border-radius:6px;padding:3px 6px;margin-top:4px}
.task .q{font-size:12px;font-weight:600;color:var(--ink)}
.st{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:transparent}
.st.y{background:var(--ok);border-color:var(--ok);color:#fff} .st.k{background:var(--hl);border-color:var(--hl);color:#3b2a00} .st.n{background:var(--bad);border-color:var(--bad);color:#fff}
.st.fs{outline:2px dashed var(--accent);outline-offset:2px}
.addt{border:1.5px dashed var(--line);background:none;border-radius:9px;padding:7px;color:var(--muted);font-size:13px;display:flex;align-items:center;justify-content:center;gap:5px}
.addt:hover{border-color:var(--accent);color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}

table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t td.c,table.t th.c{text-align:center}
.tw{overflow-x:auto}
.pm{display:inline-grid;place-items:center;min-width:46px;height:30px;border-radius:8px;font-size:12px;font-weight:600;border:0;padding:0 6px}
.pm.paid{background:var(--ok-soft);color:var(--ok)} .pm.part{background:var(--warn-soft);color:var(--warn)} .pm.late{background:var(--bad-soft);color:var(--bad)} .pm.up{background:var(--surface2);color:var(--muted)} .pm.none{background:none;color:var(--line)}
/* izleme hücresi */
.mc{display:inline-flex;flex-direction:column;align-items:center;gap:2px;min-width:52px;padding:5px 4px;border-radius:9px;background:var(--surface2);border:0;font-size:11.5px;line-height:1.2}
.mc b{font-size:13px;font-variant-numeric:tabular-nums}
.mc.ok{background:var(--ok-soft)} .mc.mid{background:var(--hl-soft)} .mc.low{background:var(--bad-soft)} .mc.fut{background:none;color:var(--line)}
.mc .cd{width:8px;height:8px;border-radius:50%;background:var(--line)}
.mc .cd.ok{background:var(--ok)} .mc .cd.no{background:var(--bad)} .mc .cd.warn{background:var(--warn)} .mc .cd.acc{background:var(--accent)}

.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.gimg{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2);display:flex;flex-direction:column}
.gimg img{width:100%;aspect-ratio:4/3;object-fit:cover;cursor:zoom-in;display:block}
.gimg .cap{padding:6px 8px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:6px}

.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) 1fr 52px;gap:10px;align-items:center;font-size:13.5px}
.hbar.wb{grid-template-columns:minmax(110px,190px) 1fr 40px auto}
.hbar .tr{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:6px}
.hbar .vv{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.hbar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
svg.ch .gl{stroke:var(--line);stroke-width:1}

.tl{display:flex;flex-direction:column;gap:10px}
.tl .it{display:flex;gap:10px;font-size:13.5px}
.tl .it .d{color:var(--muted);min-width:78px;font-size:12.5px}

.subj{border-top:1px solid var(--line);padding:12px 0}
.subj:first-child{border-top:0;padding-top:0}
.subj .sh{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.subj .sh h3{font-size:15px}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tc{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;display:inline-flex;align-items:center;gap:6px;text-align:left}
.tc.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tc.b{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:600}
.tc.t{background:var(--hl-soft);border-color:transparent;color:var(--warn);font-weight:600}
.tc.e{background:var(--bad-soft);border-color:transparent;color:var(--bad);font-weight:600}
.tc .wn{background:var(--bad);color:#fff;border-radius:6px;font-size:11px;padding:0 5px;font-weight:700}
.bookrow{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bookrow:first-child{border-top:0}
.goal{display:flex;flex-direction:column;gap:6px}
.goal .gl2{display:flex;justify-content:space-between;font-size:13.5px;gap:8px;flex-wrap:wrap}
.countdown{display:inline-flex;align-items:baseline;gap:6px;background:var(--hl-soft);color:var(--warn);padding:6px 12px;border-radius:10px;font-weight:600;font-size:14px}
.countdown b{font-family:var(--f-display);font-size:20px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--surface2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:14px;overflow-wrap:anywhere;user-select:all}
.steps{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:10px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
pre.msg{white-space:pre-wrap;font-family:var(--f-body);background:var(--surface2);border-radius:12px;padding:14px;margin:0;font-size:14.5px;line-height:1.55;max-height:46vh;overflow:auto}
.rcpt{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.rcpt:first-child{border-top:0}
.ph{font-size:12.5px;color:var(--muted)}

.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
.inp,label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px;font-size:15px;color:var(--ink);min-height:42px;width:100%}
textarea{resize:vertical;min-height:70px}
.inp:focus,label.f input:focus,label.f select:focus,label.f textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.dchips{display:flex;gap:6px;flex-wrap:wrap}
.dchips button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px;font-weight:500}
.dchips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sec{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}

#modal{position:fixed;inset:0;z-index:50}
.ov{position:absolute;inset:0;background:rgba(12,16,30,.45);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.dlg{background:var(--surface);border-radius:16px;width:100%;max-width:580px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.25);margin:auto 0}
.dlg.wide{max-width:880px}
.dlg .dhd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding-top:4px}

function haftaSozu(s,p,wk){
  const ad=firstName(s.name);
  if(p&&p.motto)return{intro:'',text:p.motto.replace(/\{ad\}/g,ad),by:'Esra Hoca'};
  const ids=Object.keys(S.students).sort();const rank=Math.max(0,ids.indexOf(s.id));
  const n=Math.floor(pkey(wk).getTime()/(7*864e5));const N=SOZ_HAVUZ.length;
  const it=SOZ_HAVUZ[(((rank+n+(p&&p.mottoShift||0))%N)+N)%N];
  if(it.own)return{intro:'',text:ad?`${ad}, ${ilkKucuk(it.q)}`:it.q,by:'Esra Hoca'};
  return{intro:ad?`${ad}, bu haftanın sözü senin için:`:'Bu haftanın sözü:',text:it.q,by:it.by};
}

async function initStore(){
  try{ if(window.claude&&claude.use){ [DB,USER,downloads]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')]); } }catch(e){}
  if(USER){try{myUid=await USER.id()}catch(e){}}
  let canEdit=true;if(USER){try{canEdit=await USER.canEdit()}catch(e){}}
  if(DB&&canEdit===false){mode='student';document.body.classList.add('stu');return initStudent()}
  if(DB){
    backend='cloud';
    const waiting=new Set(SUB);let migrated=false;
    const timer=setTimeout(()=>{if(waiting.size){netWarn=true;ready=true;render()}},10000);
    SUB.forEach(c=>{
      DB.collection(`${CP}/${c}`).onSnapshot(snap=>{
        const o={};snap.docs.forEach(d=>{o[d.id]=Object.assign(clone(d.data()),{id:d.id})});
        for(const id in S[c]){const q=wq[`${CP}/${c}/${id}`];if(q&&q.busy)o[id]=S[c][id]}
        S[c]=o;
        if(!snap.metadata.fromCache){waiting.delete(c);if(!waiting.size){clearTimeout(timer);netWarn=false;ready=true;if(!migrated){migrated=true;migrateV1()}}}
        if(c==='students')ensureMarkSubs();
        scheduleRender();
      },()=>{netWarn=true;ready=true;toast('Bağlantı sorunu: veriler güncel olmayabilir');scheduleRender()});
    });
  }else{
    backend='local';
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
    try{const o=await idbGetAll();for(const c of [...SUB,'images'])if(o[c])S[c]=o[c]}catch(e){idbFail=true}
    ready=true;render();
  }
}

async function migrateV1(){
  if(!myUid||Object.keys(S.students).length)return;
  try{
    const old=`data/users/${myUid}/coach`;const snap=await DB.collection(old+'/students').get();if(snap.empty)return;
    for(const c of ['students','programs','exams','payments','images']){
      const s=c==='students'?snap:await DB.collection(`${old}/${c}`).get();
      s.docs.forEach(d=>{const b=clone(d.data());if(c!=='images')S[c][d.id]=Object.assign({},b,{id:d.id});send(`${CP}/${c}/${d.id}`,b)});
    }
    render();toast('Önceki kayıtlarınız aktarıldı');
  }catch(e){}
}
function send(path,body){outbox[path]=body;const q=wq[path]||(wq[path]={busy:false,dirty:false});q.dirty=true;if(!q.busy)flush(path,q)}
async function flush(path,q){
  q.busy=true;
  while(q.dirty){
    q.dirty=false;const body=outbox[path];const ref=DB.doc(path);
    const go=()=>body?ref.set(clone(body)):ref.delete();
    try{await go()}catch(e){
      if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{await go();continue}catch(e2){e=e2}}
      if(mode==='student'&&e&&e.code==='invalid_argument'){STU.readOnly=true;renderStu();toast('İşaretleme izniniz yok; koçunuzdan Katkıda bulunan erişimi isteyin.')}
      else if(path.startsWith('share/')&&e&&e.code==='invalid_argument')toast('Öğrenci ekranına gönderilemedi: öğrenci kodu hatalı olabilir.');
      else toast(e&&e.code==='quota_exceeded'?'Depolama alanı doldu: eski görselleri silin.':'Kaydedilemedi ('+(e&&e.code||'hata')+'). Bağlantıyı kontrol edin.');
    }
  }
  q.busy=false;
}
function persist(col,id){
  if(backend==='local'){saveLocal(col);return}
  const b=S[col][id];let body=null;if(b){body=clone(b);delete body.id}
  send(`${CP}/${col}/${id}`,body);
}
function put(col,id,obj){
  const old=S[col][id];obj.id=id;S[col][id]=obj;persist(col,id);
  if(col==='programs')syncShare(obj.sid,obj.week);
  if(col==='students'&&obj.link){shareProfile(obj);if(!old||old.link!==obj.link){pushAllShare(obj);ensureMarkSubs()}}
  scheduleRender();
}
function del(col,id){delete S[col][id];persist(col,id);scheduleRender()}

let idbP=null,idbFail=false;const dirty=new Set();let saveT;
function idb(){return idbP||(idbP=new Promise((res,rej)=>{const r=indexedDB.open('esra-hocaniz',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function idbGetAll(){const db=await idb();return new Promise((res,rej)=>{const out={};const tx=db.transaction('kv','readonly');const st=tx.objectStore('kv');const rq=st.openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};rq.onerror=()=>rej(rq.error)})}
async function idbPut(map){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');const st=tx.objectStore('kv');for(const k in map)st.put(map[k],k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
function saveLocal(col){if(col)dirty.add(col);else[...SUB,'images'].forEach(c=>dirty.add(c));clearTimeout(saveT);saveT=setTimeout(flushLocal,300)}
async function flushLocal(){const cols=[...dirty];dirty.clear();if(!cols.length)return;const map={};cols.forEach(c=>map[c]=JSON.parse(JSON.stringify(S[c])));try{await idbPut(map)}catch(e){cols.forEach(c=>dirty.add(c));toast('Kaydedilemedi: iPad hafızası dolu olabilir. Yedek alıp eski görselleri silin.')}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&dirty.size){clearTimeout(saveT);flushLocal()}});

const validLink=l=>/^[A-Za-z0-9_\-.~:@+]{4,200}$/.test(l)&&l!=='.'&&l!=='..';
function shareProfile(s){

function syncShare(sid,wk){
  const s=S.students[sid];if(backend!=='cloud'||!s||!s.link||!validLink(s.link))return;
  const p=S.programs[pid(sid,wk)];if(!p)return;

function pushAllShare(s){const from=wkey(addD(today(),-7));Object.values(S.programs).filter(p=>p.sid===s.id&&p.week>=from).forEach(p=>syncShare(s.id,p.week))}
function ensureMarkSubs(){
  if(backend!=='cloud')return;
  Object.values(S.students).forEach(s=>{
    const l=s.link;if(!l||!validLink(l))return;const k=s.id+'|'+l;if(markSubs[k])return;

const msgTpls=()=>{const t=SET().msgTpls;return Array.isArray(t)&&t.length?t:DEF_TPL};
function examDateFor(s){const st=SET();if(s.target==='LGS')return{name:'LGS',date:st.lgs};if(String(s.target||'').startsWith('YKS'))return{name:'YKS',date:st.yks};return null}
const pid=(sid,wk)=>`${sid}_${wk}`;
const mergeCache=new WeakMap();
// koçun programı + öğrencinin kendi ekranından işaretledikleri
function prog(sid,wk){
  const p=S.programs[pid(sid,wk)];if(!p)return null;
  const m=S.smarks[sid]&&S.smarks[sid][wk];if(!m)return p;
  const c=mergeCache.get(p);if(c&&c.m===m)return c.v;
  const v=clone(p);
  v.days.forEach((d,i)=>{d.tasks.forEach(t=>{const sm=m.marks&&m.marks[t.id];if(sm){t.sm=sm;if(!t.s){t.s=sm;t.fs=1}}});const dd=m.days&&m.days[i];if(dd){d.sq=numOrNull(dd.q);d.sh=numOrNull(dd.h)}});
  mergeCache.set(p,{m,v});return v;
}
function blankProg(sid,wk){return{sid,week:wk,days:Array.from({length:7},()=>({tasks:[],call:null})),note:'',eval:''}}
function editProg(sid,wk){const p=S.programs[pid(sid,wk)];return p?clone(p):blankProg(sid,wk)}
function dayOf(sid,date){const p=prog(sid,wkey(date));return p?p.days[dIdx(date)]:null}
function dayTasks(sid,date){const d=dayOf(sid,date);return d?d.tasks:[]}
function dayCall(sid,date){const d=dayOf(sid,date);return d?d.call:null}
function dayQH(d){if(!d)return{q:null,h:null};const c=d.call||{};return{q:numOrNull(c.q)!=null?+c.q:(d.sq!=null?d.sq:null),h:numOrNull(c.h)!=null?+c.h:(d.sh!=null?d.sh:null)}}
function score(tasks){let t=0,y=0,k=0,n=0;tasks.forEach(x=>{t++;if(x.s==='y')y++;else if(x.s==='k')k++;else if(x.s==='n')n++});return{t,y,k,n,open:t-y-k-n,p:t?(y+.5*k)/t:null}}
function rangeStats(sid,from,to){
  const end=to>today()?today():to;let tasks=[],calls=0,reached=0,days=0,q=0,h=0,qd=0,hd=0;const bySub={},moods=[],stc={};
  for(let d=new Date(from);d<=end;d=addD(d,1)){
    days++;const day=dayOf(sid,d);if(!day)continue;
    day.tasks.forEach(t=>{tasks.push(t);(bySub[t.subj]||(bySub[t.subj]=[])).push(t)});
    if(day.call){calls++;stc[day.call.st]=(stc[day.call.st]||0)+1;if(day.call.st==='ok')reached++;if(day.call.mood)moods.push(day.call.mood)}
    const x=dayQH(day);if(x.q!=null){q+=x.q;qd++}if(x.h!=null){h+=x.h;hd++}
  }
  return Object.assign(score(tasks),{calls,reached,days,bySub,q,h,qd,hd,stc,mood:moods.length?moods.reduce((a,b)=>a+b,0)/moods.length:null});
}
function weekStats(sid,wk){const a=pkey(wk);return rangeStats(sid,a,addD(a,6))}
function netOf(ex){const T=EXAMS[ex.type];let tot=0;const per={};(T?T.subs:[]).forEach(([n])=>{const r=ex.res&&ex.res[n]||{};const v=(+r.d||0)-(+r.y||0)/T.div;per[n]=v;tot+=v});return{tot,per}}
const examsOf=sid=>Object.values(S.exams).filter(e=>e.sid===sid).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.t||0)-(b.t||0));
const paysOf=sid=>Object.values(S.payments).filter(p=>p.sid===sid).sort((a,b)=>a.date<b.date?1:-1);
function monthState(st,mk){
  const fee=+st.fee||0;if(!fee)return{cls:'none',due:0,paid:0};
  const sm=(st.start||'2000-01-01').slice(0,7);if(mk<sm)return{cls:'none',due:0,paid:0};
  if(st.active===false&&st.passiveFrom&&mk>st.passiveFrom.slice(0,7))return{cls:'none',due:0,paid:0};
  const paid=Object.values(S.payments).filter(p=>p.sid===st.id&&p.period===mk).reduce((a,p)=>a+(+p.amount||0),0);
  const t=today(),cm=mkey(t),payDay=+st.payDay||1;const past=mk<cm||(mk===cm&&t.getDate()>payDay);
  let cls;if(paid>=fee)cls='paid';else if(paid>0)cls='part';else cls=past?'late':'up';
  return{cls,due:fee,paid,past};
}
function overdue(st){
  const t=today();let list=[],sum=0;
  for(let i=0;i<24;i++){const d=new Date(t.getFullYear(),t.getMonth()-i,1);const mk=mkey(d);const m=monthState(st,mk);
    if((m.cls==='late'||m.cls==='part')&&m.past){list.push(mk);sum+=m.due-m.paid}}
  return{list:list.reverse(),sum};
}
function parentDue(s){
  const every=+s.parentEvery||+SET().parentEvery||14;const log=(s.plog||[]).slice().sort((a,b)=>a.date<b.date?1:-1);
  const lastOk=log.find(x=>x.st==='ok'||x.st==='msg');const days=lastOk?daysSince(lastOk.date):null;
  return{every,last:log[0]||null,lastOk,days,due:!lastOk||days>=every,left:lastOk?every-days:0};
}
function topicSubjects(s){
  const out=[];const seen=new Set();
  (TSETS[s.target]||['TYT']).forEach(set=>Object.entries(TOPICS[set]).forEach(([subj,list])=>{if(seen.has(subj))return;seen.add(subj);out.push({subj,topics:[...list,...((s.customTopics||{})[subj]||[])]})}));
  Object.entries(s.customTopics||{}).forEach(([subj,list])=>{if(!seen.has(subj)){seen.add(subj);out.push({subj,topics:list})}});
  return out;
}
function subjOfTopic(s,topic){for(const g of topicSubjects(s))if(g.topics.includes(topic))return g.subj;return ''}
function wrongTopics(sid,n,range){
  let ex=examsOf(sid);if(range)ex=ex.filter(e=>e.date>=range[0]&&e.date<=range[1]);else ex=ex.slice(-(n||5));
  const cnt={};ex.forEach(e=>(e.wrong||[]).forEach(w=>{if(!w.topic)return;cnt[w.topic]=(cnt[w.topic]||0)+(+w.n||1)}));
  return Object.entries(cnt).map(([topic,v])=>({topic,v})).sort((a,b)=>b.v-a.v);
}
function weakTopics(s){const tp=s.topics||{};return Object.entries(tp).filter(([k,v])=>v==='e'||v==='t').map(([k,v])=>{const [subj,topic]=k.split('|');return{subj,topic,v}})}
function missStreak(sid){let miss=0;const t=today();for(let i=0;i<7;i++){const c=dayCall(sid,addD(t,-i));if(!c||c.st==='skip')continue;if(c.st==='ok'||c.st==='msg')break;miss++}return miss}
function alertsFor(st){
  const out=[];const t=today();const wk=wkey(t);const p=prog(st.id,wk);
  if(!p||!p.days.some(d=>d.tasks.length))out.push({sev:'warn',t:'Bu haftanın programı hazır değil',r:`${wLabel(wk)} haftası için hiç görev girilmemiş.`,btn:'Programa git',a:'goProg',sid:st.id});
  const miss=missStreak(st.id);
  if(miss>=2)out.push({sev:'bad',t:`${miss} aramadır ulaşılamadı`,r:'Son aramalarda öğrenci açmadı, meşguldü veya telefonu kapalıydı. Veliyi aramak iyi olabilir.',btn:'Veliyi ara',a:'pcall',sid:st.id});
  const y=addD(t,-1);const ys=score(dayTasks(st.id,y));
  if(ys.t&&ys.open<ys.t&&ys.p<.5)out.push({sev:'warn',t:`Dün görevlerin ${pct(ys.p)} kadarı yapıldı`,r:`${GUN[dIdx(y)]} günü ${ys.t} görevden ${ys.y} tanesi tam yapıldı.`,btn:'Programa git',a:'goProg',sid:st.id});
  const pd=parentDue(st);
  if(pd.due&&st.parentPhone!==undefined)out.push({sev:'info',t:pd.lastOk?'Veli araması zamanı geldi':'Veliyle henüz görüşülmedi',r:pd.lastOk?`Son veli görüşmesi ${fmtD(pd.lastOk.date)} (${pd.days} gün önce). Her ${pd.every} günde bir aranıyor.`:`Veliler her ${pd.every} günde bir aranacak şekilde ayarlı.`,btn:'Veliyi ara',a:'pcall',sid:st.id});
  const od=overdue(st);if(payOK()&&od.list.length)out.push({sev:'bad',t:`Ödeme gecikti: ${TL(od.sum)}`,r:od.list.map(mLabel).join(', ')+' ayı ödenmedi.',btn:'Ödemeler',a:'goPay',sid:st.id});
  const ex=examsOf(st.id);
  if(ex.length>=2){const a=ex[ex.length-1],b=[...ex].reverse().find(e=>e!==a&&e.type===a.type);if(b){const dlt=netOf(a).tot-netOf(b).tot;if(dlt<=-5)out.push({sev:'warn',t:`Son ${EXAMS[a.type].label} denemesinde ${fmtNet(-dlt)} net düşüş`,r:`${fmtDs(b.date)}: ${fmtNet(netOf(b).tot)} → ${fmtDs(a.date)}: ${fmtNet(netOf(a).tot)} net.`,btn:'Denemeler',a:'goExam',sid:st.id})}}
  const last=ex[ex.length-1];
  if(!last||(t-pkey(last.date))/864e5>21)out.push({sev:'info',t:last?'3 haftadır deneme girilmedi':'Hiç deneme kaydı yok',r:last?`Son deneme: ${fmtD(last.date)}.`:'Deneme analizleri için ilk denemeyi ekleyin.',btn:'Deneme ekle',a:'addExam',sid:st.id});
  const wt=wrongTopics(st.id,3).filter(w=>w.v>=4);
  if(wt.length)out.push({sev:'info',t:`Tekrarlayan yanlış: ${wt.slice(0,2).map(w=>w.topic).join(', ')}`,r:`Son 3 denemede bu konulardan toplam ${wt.slice(0,2).reduce((a,w)=>a+w.v,0)} yanlış var. Programa ek görev planlanabilir.`,btn:'Konular',a:'goTopics',sid:st.id});
  return out;
}
function todayProgramText(s,d){
  const ts=dayTasks(s.id,d||today());if(!ts.length)return '(Bugün için görev yok)';
  return ts.map(t=>`• ${t.subj}${t.topic?' – '+t.topic:''}${t.qty?` (${t.qty} ${t.unit||''})`:''}${t.note?`\n   ${t.note}`:''}`).join('\n');
}
function fillTpl(text,s){
  const od=overdue(s);const ed=examDateFor(s);
  const rep={ad:firstName(s.name),adsoyad:cleanName(s.name),veli:s.parent||'Sayın Veli',koc:COACH,bugun_program:todayProgramText(s),
    geciken_tutar:TL(od.sum),geciken_aylar:od.list.length?od.list.map(mLabel).join(', '):mLabel(mkey(today())),
    sinav_gun:ed&&daysTo(ed.date)>=0?`${ed.name}'ye ${daysTo(ed.date)} gün`:'',hedef:s.goalText||''};
  return String(text).replace(/\{haftalik_rapor\}/g,()=>parentText(s,dIdx(today())>=4?wkey(today()):wkey(addD(today(),-7)))).replace(/\{(\w+)\}/g,(m,k)=>rep[k]!=null?rep[k]:m);
}

function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x)));const f=x/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function lineChart(pts,o={}){
  const W=640,H=o.h||210,P={l:38,r:16,t:16,b:30};
  if(!pts.length)return `<div class="empty small">Grafik için veri yok.</div>`;
  const vals=pts.map(p=>p.v).concat(o.goal!=null?[o.goal]:[]);let mx=Math.max(...vals);let mn=Math.min(0,...vals);
  const step=niceStep((mx-mn)/4||1);mx=Math.ceil(mx/step)*step||step;mn=Math.floor(mn/step)*step;
  const X=i=>P.l+(pts.length===1?(W-P.l-P.r)/2:i*(W-P.l-P.r)/(pts.length-1));
  const Y=v=>P.t+(H-P.t-P.b)*(1-(v-mn)/(mx-mn||1));
  let g='';for(let v=mn;v<=mx+1e-9;v+=step){g+=`<line class="gl" x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${P.l-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v*10)/10}</text>`}
  if(o.goal!=null)g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(o.goal)}" y2="${Y(o.goal)}" stroke="var(--ok)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-P.r}" y="${Y(o.goal)-5}" text-anchor="end" style="fill:var(--ok);font-weight:600">Hedef ${fmtNet(o.goal)}</text>`;
  const every=Math.ceil(pts.length/8);
  pts.forEach((p,i)=>{if(i%every===0||i===pts.length-1)g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${esc(p.label)}</text>`});
  const c=o.color||'var(--accent)';
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(i)},${Y(p.v)}`).join('');
  const area=`${line}L${X(pts.length-1)},${Y(mn)}L${X(0)},${Y(mn)}Z`;const gid='g'+hash(line);
  const dots=pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.v)}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?c:'var(--surface)'}" stroke="${c}" stroke-width="2"><title>${esc(p.label)}: ${fmtNet(p.v)}</title></circle>`).join('');
  const lp=pts[pts.length-1];
  const lbl=`<text x="${Math.min(X(pts.length-1),W-P.r-4)}" y="${Y(lp.v)-11}" text-anchor="${pts.length>1?'end':'middle'}" style="fill:var(--ink);font-weight:600;font-size:12px">${fmtNet(lp.v)}</text>`;
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".22"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>${g}<path d="${area}" fill="url(#${gid})"/><path d="${line}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round"/>${dots}${lbl}</svg>`;
}
function colChart(pts,o={}){
  const W=640,H=o.h||200,P={l:42,r:10,t:18,b:30};
  if(!pts.length)return `<div class="empty small">Grafik için veri yok.</div>`;
  let mx=o.max||Math.max(...pts.map(p=>p.v||0),1);if(!o.max){const st=niceStep(mx/4);mx=Math.ceil(mx/st)*st}
  const n=pts.length;const bw=Math.min(40,(W-P.l-P.r)/n*.62);
  const X=i=>P.l+(i+.5)*(W-P.l-P.r)/n;const Y=v=>P.t+(H-P.t-P.b)*(1-v/mx);
  const fv=v=>o.pct?pct(v):o.dec?fmtN(v):Math.round(v).toLocaleString('tr-TR');
  let g='';[0,.25,.5,.75,1].forEach(f=>{g+=`<line class="gl" x1="${P.l}" x2="${W-P.r}" y1="${Y(mx*f)}" y2="${Y(mx*f)}"/><text x="${P.l-6}" y="${Y(mx*f)+4}" text-anchor="end">${o.pct?Math.round(f*100)+'%':fmtN(mx*f)}</text>`});
  pts.forEach((p,i)=>{
    const v=p.v;g+=`<text x="${X(i)}" y="${H-9}" text-anchor="middle">${esc(p.label)}</text>`;
    if(v==null){g+=`<rect x="${X(i)-bw/2}" y="${Y(0)-2}" width="${bw}" height="2" fill="var(--line)"/>`;return}
    const col=o.pct?(v>=.8?'var(--ok)':v>=.5?'var(--hl)':'var(--bad)'):(o.color||'var(--accent)');
    g+=`<rect x="${X(i)-bw/2}" y="${Y(v)}" width="${bw}" height="${Math.max(0,Y(0)-Y(v))}" rx="4" fill="${col}"><title>${esc(p.label)}: ${fv(v)}</title></rect>`;
    if(i===n-1||o.labels)g+=`<text x="${X(i)}" y="${Y(v)-5}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${fv(v)}</text>`;
  });
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function hbars(items,o={}){
  if(!items.length)return `<div class="empty small">Veri yok.</div>`;
  const mx=o.max||Math.max(...items.map(i=>i.v),1);
  return `<div class="hbars">${items.map(i=>{const col=i.color||(o.pct?(i.v>=.8?'var(--ok)':i.v>=.5?'var(--hl)':'var(--bad)'):'var(--accent)');
    return `<div class="hbar"><span title="${esc(i.label)}">${esc(i.label)}</span><div class="tr"><i style="width:${Math.max(0,Math.min(100,i.v/mx*100))}%;background:${col}"></i></div><span class="vv">${o.pct?pct(i.v):(o.fmt?o.fmt(i.v):i.v)}</span></div>`}).join('')}</div>`;
}

/* ============ ŞİFRE VE GİZLİLİK ============

let payUnlocked=false,hiddenAt=0,pinFails=0,pinWaitUntil=0;
const hasPin=()=>!!SET().pinHash;

async function pinHash(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('esra-hocaniz:'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

async function pinSubmit(){
  const purpose=ui.pinPurpose;const set=!hasPin()||purpose==='change';
  if(Date.now()<pinWaitUntil){toast(`Çok fazla yanlış deneme. ${Math.ceil((pinWaitUntil-Date.now())/1000)} saniye bekleyin.`);return}
  const p1=val('pin1');
  if(set){
    if(purpose==='change'&&hasPin()&&await pinHash(val('pinOld'))!==SET().pinHash){toast('Mevcut şifre yanlış');return}
    if(!/^\d{4,8}$/.test(p1)){toast('Şifre 4–8 haneli rakamlardan oluşmalı');return}
    if(p1!==val('pin2')){toast('İki şifre aynı değil');return}
    saveSettings({pinHash:await pinHash(p1)});payUnlocked=true;closeModal();toast('Şifre kaydedildi');
    if(purpose==='exit'){ui.present=null}
    render();return;
  }
  if(await pinHash(p1)!==SET().pinHash){pinFails++;if(pinFails>=5){pinWaitUntil=Date.now()+30000;pinFails=0}toast('Şifre yanlış');const e=$('#pin1');if(e){e.value='';e.focus()}return}
  pinFails=0;closeModal();
  if(purpose==='exit'){ui.present=null;window.scrollTo(0,0)}else payUnlocked=true;
  render();
}

/* ============ BUGÜN ============ */
function vBugun(){
  const t=today(),ss=students();
  const hr=new Date().getHours();const greet=hr<12?'Günaydın':hr<18?'İyi günler':'İyi akşamlar';
  const head=`<div class="head"><div><div class="eyebrow">${GUN[dIdx(t)]}, ${fmtD(t)}</div><h1>${greet} Esra Hoca</h1><p>Günlük arama ve kontrol listesi</p></div>
    <div class="row">${countdowns(ss)}${ss.length?`<button class="btn pri" data-a="startRound">${ic('play')}Arama turunu başlat</button><button class="btn wa" data-a="bulk">${ic('wa')}Toplu WhatsApp</button>`:''}<button class="btn" data-a="newStudent">${ic('plus')}Öğrenci</button></div></div>`;
  if(!ss.length)return head+noStudents();
  let called=0,reached=0,tt=[],late=0,lateSum=0,qT=0,hT=0;
  ss.forEach(s=>{const c=dayCall(s.id,t);if(c){called++;if(c.st==='ok')reached++}tt=tt.concat(dayTasks(s.id,t));const od=overdue(s);if(od.list.length){late++;lateSum+=od.sum}});
  const sc=score(tt);const wk=wkey(t);let wy=0,wtot=0;ss.forEach(s=>{const w=weekStats(s.id,wk);wy+=w.y+.5*w.k;wtot+=w.t;qT+=w.q;hT+=w.h});
  const pdue=ss.filter(s=>parentDue(s).due);
  const kpis=`<div class="kpis">
    <div class="kpi"><span class="l">Bugün aranan</span><span class="v num">${called}<small> / ${ss.length}</small></span><div class="meter"><i style="width:${called/ss.length*100}%"></i></div><span class="s">${reached} öğrenciyle konuşuldu</span></div>
    <div class="kpi"><span class="l">Bugünkü görevler</span><span class="v num">${sc.t?pct(sc.p):'–'}</span><div class="meter"><i style="width:${(sc.p||0)*100}%;background:var(--ok)"></i></div><span class="s">${sc.t} görev · ${sc.open} işaretlenmedi</span></div>
    <div class="kpi"><span class="l">Bu hafta çalışma</span><span class="v num">${fmtN(hT)}<small> saat</small></span><span class="s">${qT.toLocaleString('tr-TR')} soru · tamamlama ${wtot?pct(wy/wtot):'–'}</span></div>
    <button class="kpi" data-a="pcallList"><span class="l">Aranacak veli</span><span class="v num" style="color:${pdue.length?'var(--warn)':'inherit'}">${pdue.length}</span><span class="s">Arama aralığı dolanlar</span></button>
    ${payOK()?`<button class="kpi" data-a="nav" data-v="odeme"><span class="l">Geciken ödeme</span><span class="v num" style="color:${late?'var(--bad)':'inherit'}">${late}<small> öğrenci</small></span><span class="s">${late?TL(lateSum)+' bekleniyor':'Gecikme yok'}</span></button>`:`<button class="kpi" data-a="unlockPay"><span class="l">Ödemeler</span><span class="v">${ic('lock')}</span><span class="s">Kilitli · görmek için dokunun</span></button>`}
  </div>`;
  const rows=ss.map(s=>{
    const c=dayCall(s.id,t);const ts=score(dayTasks(s.id,t));const qh=dayQH(dayOf(s.id,t));
    return `<div class="crow">${avatar(s)}<div class="grow"><div class="nm">${esc(s.name)}</div><div class="meta">${ts.t?`${ts.t} görev, ${ts.y} yapıldı`:'Bugün görev yok'}${qh.h!=null?` · ${fmtN(qh.h)} saat`:''}${qh.q!=null?` · ${qh.q} soru`:''}${c&&c.note?' · “'+esc(c.note.slice(0,50))+'”':''}</div></div>${callChip(c)}<button class="btn sm ${c?'':'pri'}" data-a="call" data-id="${s.id}">${ic('phone','s')}${c?'Düzenle':'Ara'}</button></div>`}).join('');
  const al=[];ss.forEach(s=>alertsFor(s).forEach(a=>al.push(Object.assign(a,{st:s}))));
  const ord={bad:0,warn:1,info:2};al.sort((a,b)=>ord[a.sev]-ord[b.sev]);
  const alerts=al.length?`<div class="alerts">${al.slice(0,ui.allAlerts?99:8).map(a=>`<div class="alert ${a.sev}"><span class="sev"></span>${avatar(a.st,30)}<div class="grow"><div class="t">${esc(a.st.name)}: ${esc(a.t)}</div><div class="r">${esc(a.r)}</div></div><button class="btn sm" data-a="${a.a}" data-id="${a.sid}">${esc(a.btn)}</button></div>`).join('')}${al.length>8&&!ui.allAlerts?`<button class="btn ghost sm" data-a="allAlerts">Tüm uyarılar (${al.length})</button>`:''}</div>`:`<div class="empty small">${ic('check')}Her şey yolunda, dikkat gerektiren bir durum yok.</div>`;
  return head+backupBanner()+kpis+`<div class="grid g2"><div class="card"><div class="ctitle"><h2>Öğrenci aramaları</h2><span class="muted small">${called}/${ss.length} tamamlandı</span></div><div class="calls">${rows}</div></div><div class="card"><div class="ctitle"><h2>Dikkat edilecekler</h2><span class="chip ${al.some(a=>a.sev==='bad')?'bad':al.length?'warn':'ok'}">${al.length}</span></div>${alerts}</div></div>`;
}

/* ---- program görseli (PNG) ---- */
function wrapText(ctx,text,maxW){const words=String(text).split(/\s+/);const lines=[];let l='';words.forEach(w=>{const tst=l?l+' '+w:w;if(ctx.measureText(tst).width>maxW&&l){lines.push(l);l=w}else l=tst});if(l)lines.push(l);return lines}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawProgram(s,wk){
  const p=S.programs[pid(s.id,wk)]||blankProg(s.id,wk);
  const W=2000,colW=(W-80-6*14)/7,PAD=40;
  const c=document.createElement('canvas');const ctx=c.getContext('2d');
  const F='Inter, Segoe UI, Arial, sans-serif',FD='Outfit, Avenir Next, Segoe UI, Arial, sans-serif';
  const taskH=t=>{ctx.font=`700 23px ${F}`;const sl=wrapText(ctx,t.subj,colW-64).length;ctx.font=`500 21px ${F}`;const tl=t.topic?wrapText(ctx,t.topic,colW-34).length:0;ctx.font=`italic 500 20px ${F}`;const nl=t.note?String(t.note).split('\n').reduce((a,p)=>a+wrapText(ctx,p,colW-40).length,0):0;return 18+sl*30+tl*27+(t.qty?30:0)+(nl?nl*26+12:0)};
  const colH=p.days.map(d=>d.tasks.reduce((a,t)=>a+taskH(t)+12,0));
  const bodyH=Math.max(260,...colH)+80;
  ctx.font=`400 26px ${F}`;const noteLines=p.note?wrapText(ctx,p.note,W-2*PAD-40):[];
  const ed=examDateFor(s);const cd=ed&&daysTo(ed.date)>=0?`${ed.name}'ye ${daysTo(ed.date)} gün`:'';
  const soz=haftaSozu(s,p,wk);ctx.font=`italic 600 30px ${FD}`;const sozLines=wrapText(ctx,'“'+soz.text+'”',W-2*PAD-120);const sozH=sozLines.length*42+(soz.intro?34:0)+112;
  const H=PAD+150+bodyH+(noteLines.length?noteLines.length*36+96:0)+sozH+60;
  c.width=W;c.height=H;
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);
  ctx.fillStyle=s.color||'#2f52cf';ctx.fillRect(0,0,W,14);
  ctx.fillStyle='#1c2236';ctx.font=`700 52px ${FD}`;ctx.fillText(cleanName(s.name),PAD,PAD+70);
  ctx.font=`500 28px ${F}`;ctx.fillStyle='#5f6883';ctx.fillText(`Haftalık Çalışma Programı · ${wLabel(wk)}`,PAD,PAD+112);
  if(cd){ctx.font=`700 30px ${FD}`;const w=ctx.measureText(cd).width+40;ctx.fillStyle='#fdf1d2';roundRect(ctx,W-PAD-w,PAD+40,w,56,12);ctx.fill();ctx.fillStyle='#7a5500';ctx.fillText(cd,W-PAD-w+20,PAD+79)}
  const y0=PAD+150;
  p.days.forEach((d,i)=>{
    const x=PAD+i*(colW+14);const dd=addD(pkey(wk),i);
    ctx.fillStyle='#eef1f7';roundRect(ctx,x,y0,colW,56,12);ctx.fill();
    ctx.fillStyle='#1c2236';ctx.font=`600 26px ${FD}`;ctx.fillText(GUN[i],x+16,y0+37);
    ctx.fillStyle='#5f6883';ctx.font=`500 20px ${F}`;const ds=fmtDs(dd);ctx.fillText(ds,x+colW-16-ctx.measureText(ds).width,y0+36);
    let y=y0+72;
    d.tasks.forEach(t=>{
      const h=taskH(t);
      ctx.fillStyle='#f6f7fb';roundRect(ctx,x,y,colW,h,10);ctx.fill();
      ctx.fillStyle=subjColor(t.subj);ctx.fillRect(x,y+6,5,h-12);
      ctx.fillStyle='#1c2236';ctx.font=`700 23px ${F}`;let yy=y+6;wrapText(ctx,t.subj,colW-64).forEach(l=>{yy+=30;ctx.fillText(l,x+18,yy)});
      ctx.font=`500 21px ${F}`;ctx.fillStyle='#5f6883';(t.topic?wrapText(ctx,t.topic,colW-34):[]).forEach(l=>{yy+=27;ctx.fillText(l,x+18,yy)});
      if(t.note){ctx.font=`italic 500 20px ${F}`;const nls=String(t.note).split('\n').flatMap(p=>wrapText(ctx,p,colW-40));ctx.fillStyle='#fdf1d2';roundRect(ctx,x+12,yy+8,colW-22,nls.length*26+8,6);ctx.fill();ctx.fillStyle='#5a4300';nls.forEach(l=>{yy+=26;ctx.fillText(l,x+18,yy+6)});yy+=12}
      if(t.qty){yy+=30;ctx.fillStyle='#1c2236';ctx.font=`700 21px ${F}`;ctx.fillText(`${t.qty} ${t.unit||''}`,x+18,yy)}
      ctx.strokeStyle='#c9cfdc';ctx.lineWidth=2;roundRect(ctx,x+colW-40,y+12,26,26,6);ctx.stroke();
      y+=h+12;
    });
  });
  let y=y0+bodyH;
  if(noteLines.length){ctx.fillStyle='#fdf1d2';roundRect(ctx,PAD,y,W-2*PAD,noteLines.length*36+60,14);ctx.fill();ctx.fillStyle='#7a5500';ctx.font=`700 24px ${F}`;ctx.fillText('Bu haftanın hedefi',PAD+22,y+38);ctx.fillStyle='#3b2a00';ctx.font=`400 26px ${F}`;noteLines.forEach((l,k)=>ctx.fillText(l,PAD+22,y+78+k*36));y+=noteLines.length*36+96}
  // haftanın motivasyon cümlesi
  ctx.textAlign='center';ctx.fillStyle=s.color||'#2f52cf';ctx.font=`700 18px ${F}`;ctx.fillText('HAFTANIN SÖZÜ',W/2,y+24);
  let sy=y+30;if(soz.intro){ctx.fillStyle='#5f6883';ctx.font=`500 22px ${F}`;ctx.fillText(soz.intro,W/2,sy+28);sy+=34}
  ctx.fillStyle='#1c2236';ctx.font=`italic 600 30px ${FD}`;sozLines.forEach((l,k)=>ctx.fillText(l,W/2,sy+36+k*42));
  sy+=sozLines.length*42+34;ctx.fillStyle=s.color||'#2f52cf';ctx.font=`600 22px ${F}`;ctx.fillText('— '+soz.by,W/2,sy+12);ctx.textAlign='left';
  ctx.fillStyle='#9aa2bb';ctx.font=`500 20px ${F}`;ctx.fillText('Yaptığın görevin kutusunu işaretle. Kolay gelsin!',PAD,H-28);
  ctx.font=`700 22px ${FD}`;ctx.fillStyle=s.color||'#2f52cf';const sig=`${APP} · ${COACH}`;ctx.fillText(sig,W-PAD-ctx.measureText(sig).width,H-28);
  return c;
}

function parentText(s,wk){
  const a=pkey(wk),b=addD(a,6);const st=rangeStats(s.id,a,b);const ex=examsOf(s.id).filter(e=>e.date>=wk&&e.date<=dkey(b));
  const all=examsOf(s.id);const lines=[];const first=firstName(s.name);
  lines.push(`Merhaba ${s.parent||'Sayın Veli'},`);
  lines.push(`${first}'ın ${wLabel(wk)} haftalık çalışma özetini paylaşıyorum:`);lines.push('');
  if(st.t)lines.push(`✅ Görev tamamlama: %${Math.round(st.p*100)} (${st.t} görevden ${st.y} tanesi tam${st.k?`, ${st.k} tanesi kısmen`:''} yapıldı)`);
  else lines.push('✅ Bu hafta için görev planlanmadı.');
  if(st.hd)lines.push(`⏱️ Toplam çalışma süresi: ${fmtN(st.h)} saat (günlük ortalama ${fmtN(st.h/st.hd)} saat)`);
  if(st.qd)lines.push(`📝 Çözülen soru: ${st.q.toLocaleString('tr-TR')}`);
  if(st.calls)lines.push(`📞 Günlük görüşme: ${st.calls} gün arandı, ${st.reached} gün görüşüldü${st.mood?` · Motivasyon ortalaması ${fmtN(st.mood)}/5`:''}`);
  const sub=Object.entries(st.bySub).map(([k,v])=>[k,score(v)]).filter(x=>x[1].t>=2).sort((x,y)=>y[1].p-x[1].p);
  if(sub.length>=2){lines.push(`💪 En düzenli çalıştığı ders: ${sub[0][0]} (%${Math.round(sub[0][1].p*100)})`);const w=sub[sub.length-1];if(w[1].p<.7)lines.push(`📌 Daha fazla özen gereken ders: ${w[0]} (%${Math.round(w[1].p*100)})`)}
  const showEx=ex.length?ex:all.slice(-1);
  showEx.forEach(e=>{const n=netOf(e).tot;const prev=[...all].reverse().find(x=>x.type===e.type&&x.date<e.date);const d=prev?n-netOf(prev).tot:null;
    lines.push(`📊 ${EXAMS[e.type].label} denemesi (${fmtDs(e.date)}): ${fmtNet(n)} net${d!=null?` (${d>=0?'+':''}${fmtNet(d)})`:''}`)});
  const g=s.goals||{};const typ=showEx.length?showEx[showEx.length-1].type:null;
  if(typ&&numOrNull(g[typ])!=null){const last=[...all].reverse().find(e=>e.type===typ);const gap=+g[typ]-netOf(last).tot;lines.push(`🎯 Hedef: ${fmtNet(+g[typ])} net${gap>0?` · hedefe ${fmtNet(gap)} net kaldı`:' · hedefe ulaşıldı'}`)}
  const ed=examDateFor(s);if(ed&&daysTo(ed.date)>=0)lines.push(`⏳ ${ed.name}'ye ${daysTo(ed.date)} gün kaldı.`);
  const wt=wrongTopics(s.id,3).slice(0,3).map(w=>w.topic);const weak=weakTopics(s).filter(w=>w.v==='e').slice(0,3).map(w=>w.topic);
  const focus=[...new Set([...wt,...weak])].slice(0,4);if(focus.length)lines.push(`🔎 Önümüzdeki dönemde odaklanacağımız konular: ${focus.join(', ')}`);
  const p=S.programs[pid(s.id,wk)];if(p&&p.eval){lines.push('');lines.push(`💬 Değerlendirmem: ${p.eval}`)}
  lines.push('');lines.push('Sorularınız için her zaman ulaşabilirsiniz. İyi haftalar dilerim.');lines.push(COACH);
  return lines.join('\n');
}

function examPanel(s){
  const ex=examsOf(s.id);
  if(!ex.length)return `<div class="card empty"><h3>${esc(s.name)} için deneme kaydı yok</h3><p>Deneme sonuçlarını doğru/yanlış olarak girin, netler otomatik hesaplansın.</p><button class="btn pri" data-a="addExam" data-id="${s.id}">${ic('plus')}İlk denemeyi ekle</button></div>`;
  const types=[...new Set(ex.map(e=>e.type))];
  const typ=ui.examType&&types.includes(ui.examType)?ui.examType:ex[ex.length-1].type;
  const T=EXAMS[typ];const list=ex.filter(e=>e.type===typ);const nets=list.map(netOf);
  const last=nets[nets.length-1],prev=nets[nets.length-2];
  const avg3=nets.slice(-3).reduce((a,n)=>a+n.tot,0)/Math.min(3,nets.length);
  const best=Math.max(...nets.map(n=>n.tot));

  const trend=nets.length>=2?last.tot-prev.tot:null;const goal=numOrNull((s.goals||{})[typ]);

  if(goal!=null)tip.push(goal>last.tot?`Hedef ${fmtNet(goal)} net; son denemeye göre <b>${fmtNet(goal-last.tot)} net</b> açık var.`:`Son deneme <b>hedefin üzerinde</b> (${fmtNet(goal)} net).`);
  if(nets.length>=3){const lw=nets.slice(-3).map(n=>n.per[weak.label]);if(lw[2]>lw[0])tip.push(`${esc(weak.label)} netleri son 3 denemede yükseliyor (${lw.map(fmtNet).join(' → ')}).`)}
  const wt=wrongTopics(s.id,5);

  const lastEx=list[list.length-1];const mx=Math.max(...T.subs.map(s=>s[1]));const wmx=wt.length?wt[0].v:1;
  return `${types.length>1?`<div class="seg">${types.map(k=>`<button class="${k===typ?'on':''}" data-a="exType" data-v="${k}">${EXAMS[k].label}</button>`).join('')}</div>`:''}

    <div class="kpi"><span class="l">Değişim</span><span class="v num" style="color:${trend==null?'inherit':trend>=0?'var(--ok)':'var(--bad)'}">${trend==null?'–':(trend>=0?'+':'')+fmtNet(trend)}</span><span class="s">Bir önceki denemeye göre</span></div>
    <div class="kpi"><span class="l">Son 3 ortalama</span><span class="v num">${fmtNet(avg3)}</span><span class="s">En iyi: ${fmtNet(best)} net</span></div>
    <div class="kpi"><span class="l">Hedef</span><span class="v num">${goal!=null?fmtNet(goal):'–'}</span><span class="s">${goal!=null?(goal>last.tot?fmtNet(goal-last.tot)+' net kaldı':'Hedefe ulaşıldı'):'Öğrenci bilgilerinden girin'}</span></div>
  </div>
  <div class="grid g2">
   <div class="card"><div class="ctitle"><h3>Toplam net gelişimi</h3><button class="btn sm" data-a="addExam" data-id="${s.id}">${ic('plus','s')}Deneme ekle</button></div>${lineChart(list.map((e,i)=>({label:fmtDs(e.date),v:nets[i].tot})),{goal})}</div>
   <div class="card"><div class="ctitle"><h3>Ders bazında net (son 3 ortalama)</h3><span class="muted small">net / soru sayısı</span></div>${hbars(ratios.map(r=>({label:r.label,v:r.v,color:subjColor(r.label)})),{max:mx,fmt:v=>fmtNet(v)})}<div class="small muted" style="margin-top:8px">${ratios.map(r=>`${esc(r.label)}: ${fmtNet(r.v)}/${r.q}`).join(' · ')}</div></div>
  </div>
  <div class="grid g2">

   <div class="card"><div class="ctitle"><h3>Ders bazında yanlış sayısı</h3><span class="muted small">Son 3 deneme ortalaması</span></div>${hbars(wrongBySub,{fmt:v=>fmtN(v)})}</div>

  <div class="card"><div class="ctitle"><h3>Değerlendirme</h3></div><div style="display:flex;flex-direction:column;gap:6px">${tip.map(t=>`<div class="row" style="align-items:flex-start;flex-wrap:nowrap"><span style="color:var(--accent);margin-top:2px">${ic('check','s')}</span><span>${t}</span></div>`).join('')}</div>${lastEx.note?`<p style="margin:12px 0 0;white-space:pre-wrap"><b>Koç notu (son deneme):</b> ${esc(lastEx.note)}</p>`:''}</div>
  <div class="card"><div class="ctitle"><h3>Tüm ${T.label} denemeleri</h3></div><div class="tw"><table class="t"><thead><tr><th>Tarih</th><th>Deneme</th>${T.subs.map(([n])=>`<th class="n">${esc(n)}</th>`).join('')}<th class="n">Toplam</th><th>Yanlış konular</th><th></th></tr></thead><tbody>${list.map((e,i)=>`<tr><td>${fmtDs(e.date)}</td><td>${esc(e.name||'–')}</td>${T.subs.map(([n])=>`<td class="n">${fmtNet(nets[i].per[n])}</td>`).join('')}<td class="n"><b>${fmtNet(nets[i].tot)}</b></td><td class="small">${(e.wrong||[]).map(w=>esc(w.topic)+' ('+w.n+')').join(', ')||'<span class="muted">–</span>'}</td><td class="n"><button class="ib" style="width:32px;height:32px" data-a="editExam" data-id="${e.id}" aria-label="Düzenle">${ic('edit','s')}</button></td></tr>`).reverse().join('')}</tbody></table></div></div>`;

function calcNets(){
  const T=EXAMS[ui.exDraft.type];let tot=0;

}

  const r=pkey(ui.ref);
  if(ui.period==='hafta'){const a=monday(r);return{a,b:addD(a,6),label:wLabel(dkey(a))}}
  if(ui.period==='ay'){const a=new Date(r.getFullYear(),r.getMonth(),1);return{a,b:new Date(r.getFullYear(),r.getMonth()+1,0),label:`${AY[r.getMonth()]} ${r.getFullYear()}`}}
  return{a:new Date(r.getFullYear(),0,1),b:new Date(r.getFullYear(),11,31),label:String(r.getFullYear())};
}
function reportRows(){
  const {a,b}=periodRange();const ak=dkey(a),bk=dkey(b);
  return students(true).filter(s=>s.active!==false||Object.values(S.programs).some(p=>p.sid===s.id)).map(s=>{
    const st=rangeStats(s.id,a,b);const ex=examsOf(s.id).filter(e=>e.date>=ak&&e.date<=bk);
    const nets=ex.map(e=>netOf(e).tot);let dnet=null;if(ex.length>=2&&ex[0].type===ex[ex.length-1].type)dnet=nets[nets.length-1]-nets[0];
    let due=0;for(let d=new Date(a.getFullYear(),a.getMonth(),1);d<=b;d=new Date(d.getFullYear(),d.getMonth()+1,1)){due+=monthState(s,mkey(d)).due}
    const paid=Object.values(S.payments).filter(p=>p.sid===s.id&&p.date>=ak&&p.date<=bk).reduce((x,p)=>x+(+p.amount||0),0);
    const pc=(s.plog||[]).filter(l=>l.date>=ak&&l.date<=bk).length;
    return{s,st,exN:ex.length,avg:nets.length?nets.reduce((x,y)=>x+y,0)/nets.length:null,dnet,due:ui.period==='hafta'?0:due,paid,mood:st.mood,pc,wt:wrongTopics(s.id,0,[ak,bk])};
  });
}

  if(!rows.length)return head+noStudents();
  const T=rows.reduce((o,r)=>{o.t+=r.st.t;o.d+=r.st.y+.5*r.st.k;o.c+=r.st.calls;o.r+=r.st.reached;o.e+=r.exN;o.due+=r.due;o.paid+=r.paid;o.q+=r.st.q;o.h+=r.st.h;o.pc+=r.pc;return o},{t:0,d:0,c:0,r:0,e:0,due:0,paid:0,q:0,h:0,pc:0});
  let trend=[];
  if(ui.period==='hafta'){for(let i=0;i<7;i++){const d=addD(pr.a,i);let tt=[];rows.forEach(r=>tt=tt.concat(dayTasks(r.s.id,d)));const sc=score(tt);trend.push({label:GN[i],v:d>today()||!sc.t?null:sc.p})}}
  else if(ui.period==='ay'){for(let w=monday(pr.a);w<=pr.b;w=addD(w,7)){let t=0,dn=0;rows.forEach(r=>{const st=weekStats(r.s.id,dkey(w));t+=st.t;dn+=st.y+.5*st.k});trend.push({label:fmtDs(w),v:t?dn/t:null})}}
  else{for(let m=0;m<12;m++){const a=new Date(pr.a.getFullYear(),m,1),b=new Date(pr.a.getFullYear(),m+1,0);let t=0,dn=0;if(a<=today())rows.forEach(r=>{const st=rangeStats(r.s.id,a,b);t+=st.t;dn+=st.y+.5*st.k});trend.push({label:AYK[m],v:t?dn/t:null})}}
  const gw={};rows.forEach(r=>r.wt.forEach(w=>{gw[w.topic]=(gw[w.topic]||0)+w.v}));const gwl=Object.entries(gw).map(([label,v])=>({label,v,color:'var(--bad)'})).sort((a,b)=>b.v-a.v).slice(0,10);
  return head+`<div class="kpis">

   ${payOK()?`<div class="kpi"><span class="l">Tahsilat</span><span class="v num">${TL(T.paid)}</span><span class="s">${ui.period==='hafta'?'Bu hafta alınan':'Beklenen '+TL(T.due)}</span></div>`:`<button class="kpi" data-a="unlockPay"><span class="l">Tahsilat</span><span class="v">${ic('lock')}</span><span class="s">Kilitli</span></button>`}</div>
  <div class="grid g2"><div class="card"><div class="ctitle"><h3>Öğrencilere göre tamamlama</h3></div>${hbars(rows.filter(r=>r.st.t).map(r=>({label:r.s.name,v:r.st.p})).sort((a,b)=>b.v-a.v),{pct:true,max:1})}</div>
  <div class="card"><div class="ctitle"><h3>Dönem içinde tamamlama</h3><span class="muted small">Tüm öğrenciler</span></div>${colChart(trend,{pct:true,max:1})}</div>

  <div class="card"><div class="ctitle"><h3>Dönemin en çok hata yapılan konuları</h3></div>${gwl.length?hbars(gwl):'<div class="empty small">Bu dönemde girilen denemelerde konu kaydı yok.</div>'}</div></div>
  <div class="card"><div class="ctitle"><h3>Öğrenci bazında rapor · ${pr.label}</h3></div><div class="tw"><table class="t"><thead><tr><th>Öğrenci</th><th class="n">Görev</th><th class="n">Oran</th><th class="n">Saat</th><th class="n">Soru</th><th class="n">Arama</th><th class="n">Motivasyon</th><th class="n">Veli</th><th class="n">Deneme</th><th class="n">Ort. net</th><th class="n">Net değişimi</th><th class="n">Ödeme</th></tr></thead><tbody>${rows.map(r=>`<tr style="cursor:pointer" data-a="openS" data-id="${r.s.id}"><td><span class="row" style="gap:8px;flex-wrap:nowrap">${avatar(r.s,26)}<span style="white-space:nowrap">${esc(r.s.name)}</span></span></td><td class="n">${r.st.t?`${r.st.y}/${r.st.t}`:'–'}</td><td class="n"><span class="chip ${r.st.p==null?'':r.st.p>=.8?'ok':r.st.p>=.5?'warn':'bad'}">${pct(r.st.p)}</span></td><td class="n">${r.st.hd?fmtN(r.st.h):'–'}</td><td class="n">${r.st.q?r.st.q.toLocaleString('tr-TR'):'–'}</td><td class="n">${r.st.reached}/${r.st.calls}</td><td class="n">${r.mood?fmtN(r.mood):'–'}</td><td class="n">${r.pc||'–'}</td><td class="n">${r.exN||'–'}</td><td class="n">${r.avg!=null?fmtNet(r.avg):'–'}</td><td class="n">${r.dnet==null?'–':`<span style="color:${r.dnet>=0?'var(--ok)':'var(--bad)'};font-weight:600">${r.dnet>=0?'+':''}${fmtNet(r.dnet)}</span>`}</td><td class="n">${!payOK()?'<span class="muted">Kilitli</span>':ui.period==='hafta'?(r.paid?TL(r.paid):'–'):(r.due?`${TL(r.paid)} / ${TL(r.due)}`:(r.paid?TL(r.paid):'–'))}</td></tr>`).join('')}</tbody></table></div></div>`;
}

 ['deneme','Denemeler ve hata analizi',`

 ['konu','Konu takibi ve kaynaklar',`

 ['veli','Veli takibi ve veli raporu',`

 ['odeme','Ödemeler',`

 ['rapor','Raporlar',`

const STU={profile:null,progs:{},marks:{},loaded:false,readOnly:false,err:null};
function initStudent(){
  backend='cloud';ready=true;
  if(!myUid){STU.err='Bu sayfayı kendi claude.ai hesabınızla giriş yaparak açın.';renderStu();return}
  const root=`share/${myUid}`;
  const t=setTimeout(()=>{if(!STU.loaded){STU.loaded=true;renderStu()}},8000);
  DB.doc(root).onSnapshot(s=>{STU.profile=s.exists?clone(s.data()):null;STU.loaded=true;clearTimeout(t);renderStu()},()=>{STU.loaded=true;renderStu()});
  DB.collection(root+'/p').onSnapshot(snap=>{const o={};snap.docs.forEach(d=>o[d.id]=clone(d.data()));STU.progs=o;scheduleRender()},()=>{});
  DB.collection(root+'/m').onSnapshot(snap=>{snap.docs.forEach(d=>{const q=wq[`${root}/m/${d.id}`];if(!(q&&q.busy))STU.marks[d.id]=clone(d.data())});scheduleRender()},()=>{});
  renderStu();
}

  <div class="card"><div class="ctitle"><div class="weeknav"><button class="ib" data-a="sWk" data-v="-1" ${idx<=0?'disabled':''} aria-label="Önceki hafta">${ic('left')}</button><span class="wl">${wLabel(wk)}</span><button class="ib" data-a="sWk" data-v="1" ${idx>=weeks.length-1?'disabled':''} aria-label="Sonraki hafta">${ic('right')}</button></div></div>

  ${p.days.map((d,i)=>{const dd=addD(pkey(wk),i);const isT=dkey(dd)===dkey(t);const md=m.days[i]||{};
    return `<div class="card sday" style="${isT?'border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)':''}"><div class="sdh"><h3>${GUN[i]} <span class="muted small" style="font-weight:500">${fmtDs(dd)}</span> ${isT?'<span class="chip acc">Bugün</span>':''}</h3>
    <div class="miniin"><label>Saat<input type="number" inputmode="decimal" step="0.5" min="0" value="${esc(md.h??'')}" data-ch="sH" data-i="${i}" ${STU.readOnly?'disabled':''}></label><label>Soru<input type="number" inputmode="numeric" min="0" value="${esc(md.q??'')}" data-ch="sQ" data-i="${i}" ${STU.readOnly?'disabled':''}></label></div></div>

  ${codeCard}`;

function saveFile(name,data,type){
  const blob=data instanceof Blob?data:new Blob([data],{type:type||'application/octet-stream'});
  try{const file=new File([blob],name,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){return navigator.share({files:[file],title:name}).then(()=>true,e=>e&&e.name==='AbortError'?false:dl())}}catch(e){}
  return Promise.resolve(dl());
  function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000);return true}
}
function dataUrlToBlob(u){const [h,b]=u.split(',');const m=h.match(/:(.*?);/)[1];const bin=atob(b);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:m})}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f){f(el.dataset,el,e)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('.scard')){e.preventDefault();e.target.click()}if(e.key==='Enter'&&e.target.id==='wTopic'){e.preventDefault();A.addWrong()}});
document.addEventListener('input',e=>{const k=e.target.dataset.in;if(k==='net')calcNets();if(k==='bText'){ui.bulk.text=e.target.value;$('#bList').innerHTML=bulkList()}});
document.addEventListener('change',e=>{
  const el=e.target,ch=el.dataset.ch;
  if(ch==='eType'){ui.exDraft.type=el.value;$('#eRows').innerHTML=examRows(el.value,ui.exDraft.id?S.exams[ui.exDraft.id]:null);calcNets()}
  if(ch==='sTarget'){const old=ui.sid&&S.students[ui.sid];$('#sGoals').innerHTML=goalInputs(el.value,old&&old.goals)}
  if(ch==='pMotto'){const s=cur();const p=editProg(s.id,ui.week);p.motto=el.value.trim();put('programs',pid(s.id,ui.week),p)}
  if(ch==='pNote'||ch==='pEval'){const s=cur();const p=editProg(s.id,ui.week);p[ch==='pNote'?'note':'eval']=el.value;put('programs',pid(s.id,ui.week),p)}
  if(ch==='bookDone'){const s=clone(cur());const b=(s.books||[]).find(x=>x.id===el.dataset.id);if(b){b.done=+el.value||0;saveS(s)}}
  if(ch==='setDate'){saveSettings({yks:val('setYks')||SET().yks,lgs:val('setLgs')||SET().lgs,parentEvery:Math.max(1,+val('setPE')||14)});students().forEach(shareProfile)}
  if(ch==='bTpl'){const t=msgTpls().find(x=>x.id===el.value);if(t){ui.bulk.tpl=t.id;ui.bulk.text=t.text;$('#bText').value=t.text;$('#bList').innerHTML=bulkList()}}
  if(ch==='bLog'){ui.bulk.log=el.checked}
  if(ch==='sQ'||ch==='sH'){const wk=ui.sweek;const m=stuMark(wk);const i=+el.dataset.i;m.days[i]=m.days[i]||{};m.days[i][ch==='sQ'?'q':'h']=numOrNull(el.value);stuSave(wk);scheduleRender()}
});
$('#fileImg').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(f)});
    let scale=Math.min(1,1400/Math.max(img.width,img.height)),q=.8,data;
    for(let k=0;k<8;k++){const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);data=c.toDataURL('image/jpeg',q);if(data.length<230000)break;if(q>.5)q-=.12;else scale*=.8}
    ui.imgData=data;
    openModal(`<div class="dhd"><h2>Görsel ekle</h2><button class="ib" data-a="close" aria-label="Kapat">${ic('x')}</button></div><img src="${data}" alt="" style="border-radius:10px;max-height:50vh;object-fit:contain"><label class="f">Açıklama<input id="iCap" placeholder="Örn. Türev konu çizelgesi"></label><div class="acts"><button class="btn ghost" data-a="close">Vazgeç</button><button class="btn pri" data-a="saveImg">Programa ekle</button></div>`);
  }catch(err){toast('Görsel okunamadı')}
});
$('#fileJson').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const o=JSON.parse(await f.text());if(o.app!=='esra-hocaniz'&&o.app!=='kocluk-defteri')throw 0;
    confirmBox('Yedek geri yüklensin mi?',`${fmtD(o.at.slice(0,10))} tarihli yedekte ${Object.keys(o.students||{}).length} öğrenci var. Aynı kayıtlar yedektekiyle değiştirilir, yedekte olmayan kayıtlarınız korunur.`,'Geri yükle',()=>{
      [...SUB,'images'].forEach(c=>{for(const id in (o[c]||{})){S[c][id]=o[c][id];S[c][id].id=id;if(backend==='cloud'&&c!=='images')persist(c,id)}});for(const k in imgCache)delete imgCache[k];if(backend==='local')saveLocal();closeModal();render();toast('Yedek geri yüklendi')});
  }catch(err){toast('Bu dosya bu programın yedeği değil')}
});
let lastDay=dkey(today());setInterval(()=>{const k=dkey(today());if(k!==lastDay){lastDay=k;ui.week=wkey(today());ui.iweek=wkey(today());scheduleRender()}},60000);
initStore();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
